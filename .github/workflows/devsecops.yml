name: DevSecOps CI and Release Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-build-test:
    name: Validate, Build, and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python syntax
        run: python -m py_compile app.py

      - name: Build Docker image
        run: docker build -t devsecops-pipeline-lab:${{ github.sha }} .

      - name: Start application container
        run: |
          docker run -d --name devsecops-lab -p 5001:5001 devsecops-pipeline-lab:${{ github.sha }}
          sleep 5

      - name: Validate health endpoint
        run: curl --fail http://127.0.0.1:5001/health

      - name: Show container logs
        if: always()
        run: docker logs devsecops-lab || true

      - name: Stop application container
        if: always()
        run: docker stop devsecops-lab || true

  zap-baseline-scan:
    name: OWASP ZAP Baseline DAST
    runs-on: ubuntu-latest
    needs: validate-build-test

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t devsecops-pipeline-lab:zap .

      - name: Start application container
        run: |
          docker run -d --name devsecops-zap-target -p 5001:5001 devsecops-pipeline-lab:zap
          sleep 5

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --network host \
            -v ${{ github.workspace }}:/zap/wrk/:rw \
            -t ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py \
            -t http://127.0.0.1:5001 \
            -r zap-report.html || true

      - name: List generated ZAP files
        if: always()
        run: |
          ls -la ${{ github.workspace }}
          find ${{ github.workspace }} -maxdepth 2 -type f -name "*zap*" -print

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: ${{ github.workspace }}/zap-report.html
          if-no-files-found: error

      - name: Stop application container
        if: always()
        run: docker stop devsecops-zap-target || true
